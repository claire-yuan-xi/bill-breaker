<div data-ai class="mt-16 hidden border-t border-[#d6d3ca] pt-10">
  <div class="text-[11px] uppercase tracking-[0.25em] text-[#7a766c]">AI breakdown</div>
  <h2 class="mt-2 font-serif text-4xl">The plain-English read</h2>
  <div data-ai-status class="mt-6 hidden items-center gap-3 font-serif text-sm text-[#7a766c]">
    <span class="inline-block h-1.5 w-1.5 animate-pulse rounded-full bg-[#7a766c]"></span>
    <span data-ai-status-text></span>
  </div>
  <div data-ai-error class="mt-6 hidden border-b border-t border-[#c4413a] py-4 font-serif text-sm text-[#c4413a]"></div>
  <div data-ai-blocks>
    {% for event in ["quick_take", "status_quo_diff", "winners_losers", "supporters_vs_critics", "citations"] %}<div data-block="{{ event }}"></div>{% endfor %}
  </div>
</div>
